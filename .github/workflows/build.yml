name: Build core

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Compile with Quartus 17.0.2 Lite
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/project -w /project \
            theypsilon/quartus-lite-c5:17.0.2 \
            quartus_sh --flow compile PCXT.qpf

      - name: Rename bitstream
        run: |
          ls -l output_files
          cp output_files/PCXT.rbf "PCXT_com2fix_$(date +%Y%m%d).rbf"

      - uses: actions/upload-artifact@v4
        with:
          name: PCXT-rbf
          path: PCXT_com2fix_*.rbf

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quartus-reports
          path: |
            output_files/*.rpt
            output_files/*.summary
