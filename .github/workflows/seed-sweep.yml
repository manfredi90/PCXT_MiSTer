name: Seed sweep

# Compiles the core with several fitter seeds (plus the unmodified upstream
# commit as a reference) and publishes every .rbf with its timing summary to
# the build-output branch.
on:
  push:
    branches: [ "fix/**" ]
    paths: [ ".github/workflows/seed-sweep.yml" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: fix-seed7, ref: "", seed: 7 }
          - { name: fix-seed8, ref: "", seed: 8 }
          - { name: fix-seed9, ref: "", seed: 9 }
          - { name: fix-seed10, ref: "", seed: 10 }
          - { name: fix-seed11, ref: "", seed: 11 }
          - { name: fix-seed12, ref: "", seed: 12 }
          - { name: fix-seed13, ref: "", seed: 13 }
          - { name: fix-seed14, ref: "", seed: 14 }
          - { name: fix-seed15, ref: "", seed: 15 }
          - { name: fix-seed16, ref: "", seed: 16 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref || github.sha }}

      - name: Set fitter seed
        if: matrix.seed != 0
        run: echo 'set_global_assignment -name SEED ${{ matrix.seed }}' >> PCXT.qsf

      - name: Compile with Quartus 17.0.2 Lite
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/project -w /project \
            theypsilon/quartus-lite-c5:17.0.2 \
            quartus_sh --flow compile PCXT.qpf

      - name: Collect
        if: always()
        run: |
          mkdir -p out/${{ matrix.name }}
          cp output_files/PCXT.rbf out/${{ matrix.name }}/PCXT_${{ matrix.name }}.rbf || true
          cp output_files/PCXT.sta.summary output_files/PCXT.fit.summary out/${{ matrix.name }}/ || true
          grep -h "Slack" output_files/PCXT.sta.summary | awk '{print $3}' | sort -n | head -1 > out/${{ matrix.name }}/worst_slack.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.name }}
          path: out/${{ matrix.name }}

  publish:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Push to build-output branch
        run: |
          cd out
          for d in */; do printf '%-18s %s\n' "${d%/}" "$(cat "$d/worst_slack.txt" 2>/dev/null)"; done | tee SUMMARY.txt
          git init -q
          git checkout -q -b build-output
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -q -m "Seed sweep of ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" build-output
